# Without this, nginx keeps the IPs resolved at startup and breaks as soon as a container is recreated
resolver 127.0.0.11 valid=10s;

upstream backend_upstream {
  # Shared memory so every worker sees DNS updates (required by resolve)
  zone backend_upstream_memory 64k;
  # DNS name of our container
  server backend:3000 resolve;
}

upstream realtime_upstream {
  # Shared memory so every worker sees DNS updates (required by resolve)
  zone realtime_upstream_memory 64k;
  # DNS name of our container
  server realtime:3001 resolve;
}
