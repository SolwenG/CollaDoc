# Server-level snippet shared by the production and development servers: included from inside server {}, so it must stay out of conf.d (read at the http level)
location /api/ {
  # Uploads are capped at 20 MB by the API, plus room for the multipart envelope
  client_max_body_size 21m;
  proxy_pass http://backend_upstream/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Realtime server (collaborative editing), WebSocket upgrade included
location /socket.io/ {
  proxy_pass http://realtime_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 1h;
}
