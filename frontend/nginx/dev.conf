# Development server: same shared locations as production, but the app comes from the Vite dev server running on the host
server {
  listen 8080;

  include /etc/nginx/snippets/common.conf;

  location / {
    proxy_pass http://host.docker.internal:9000;
    # Vite's hot module replacement uses a WebSocket on this same location
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
  }
}
