# Without this, nginx keeps the IPs resolved at startup and breaks as soon as a container is recreated
resolver 127.0.0.11 valid=10s;

upstream backend_upstream {
  # Shared memory so every worker sees DNS updates (required by resolve)
  zone backend_upstream_memory 64k;
  # DNS name of our container
  server backend:3000 resolve;
}

upstream realtime_upstream {
  # Shared memory so every worker sees DNS updates (required by resolve)
  zone realtime_upstream_memory 64k;
  # DNS name of our container
  server realtime:3001 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Uploads are capped at 20 MB by the API, plus room for the multipart envelope
    client_max_body_size 21m;
    proxy_pass http://backend_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Realtime server (collaborative editing), WebSocket upgrade included
  location /socket.io/ {
    proxy_pass http://realtime_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
