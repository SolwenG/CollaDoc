services:
    db:
        image: postgres:18-alpine3.24
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-colladoc}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colladoc}
            POSTGRES_DB: ${POSTGRES_DB:-colladoc}
        volumes:
            - db-data:/var/lib/postgresql
        ports:
            - '127.0.0.1:${DB_PORT:-5433}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - data

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        image: colladoc-backend
        init: true
        restart: unless-stopped
        stop_grace_period: 10s
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-colladoc}:${POSTGRES_PASSWORD:-colladoc}@db:5432/${POSTGRES_DB:-colladoc}
            PORT: '3000'
            REALTIME_INTERNAL_URL: http://realtime:3001
            INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
            TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set in the root .env}
            SHARE_LINK_SECRET: ${SHARE_LINK_SECRET:?SHARE_LINK_SECRET must be set in the root .env}
            UPLOAD_DIR: /app/uploads
        volumes:
            - uploads-data:/app/uploads
        ports:
            - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health']
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
            start_interval: 1s
        depends_on:
            db:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /tmp:noexec,nosuid,size=16m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - data
            - edge

    # Second server: collaborative editing over socket.io (see docs/collaboration-ot.md)
    realtime:
        image: colladoc-backend
        init: true
        command: ['node', 'src/realtime.ts']
        restart: unless-stopped
        stop_grace_period: 10s
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-colladoc}:${POSTGRES_PASSWORD:-colladoc}@db:5432/${POSTGRES_DB:-colladoc}
            REALTIME_PORT: '3001'
            INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
        ports:
            - '127.0.0.1:${REALTIME_PORT:-3001}:3001'
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/health']
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
            start_interval: 1s
        depends_on:
            db:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /tmp:noexec,nosuid,size=16m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - data
            - edge

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s
            start_interval: 1s
        restart: unless-stopped
        ports:
            - '${FRONTEND_PORT:-8080}:8080'
        depends_on:
            backend:
                condition: service_healthy
            realtime:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /tmp:noexec,nosuid,size=64m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - edge

volumes:
    db-data:
    uploads-data:

networks:
    edge:
    data:
