# Development overrides, loaded automatically by `docker compose` next to the base file.
# Same images and hardening as production: only the source mounts, the watch rules and the cookie flag differ.
x-source-mounts: &source-mounts
    - ./backend/src:/app/backend/src:ro
    - ./shared:/app/shared:ro

x-watch-src: &watch-src
    path: ./backend/src
    action: restart
    ignore: ['**/*.test.ts']

x-watch-shared: &watch-shared
    path: ./shared
    action: restart
    ignore: ['**/*.test.ts']

x-rebuild-package: &rebuild-package
    path: ./backend/package.json
    action: rebuild

x-rebuild-lockfile: &rebuild-lockfile
    path: ./backend/package-lock.json
    action: rebuild

x-rebuild-dockerfile: &rebuild-dockerfile
    path: ./backend/Dockerfile
    action: rebuild

services:
    migrate:
        develop:
            watch:
                - *rebuild-package
                - *rebuild-lockfile
                - *rebuild-dockerfile
                - path: ./backend/migrations
                  action: rebuild
                - path: ./backend/src/prisma
                  action: rebuild
                - path: ./backend/prisma.config.ts
                  action: rebuild

    backend:
        environment:
            # Session cookie also sent over plain http, so REST Client works against this container; production keeps the secure default
            COOKIE_SECURE: 'false'
        develop:
            watch:
                - *watch-src
                - *watch-shared
                - *rebuild-package
                - *rebuild-lockfile
                - *rebuild-dockerfile
        volumes: *source-mounts

    realtime:
        develop:
            watch:
                - *watch-src
                - *watch-shared
        volumes: *source-mounts
